name: Build Fabric 1.21.4 Jar

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Mod Jar
        run: gradle build

      - name: Upload Ready Jar
        uses: actions/upload-artifact@v4
        with:
          name: internal-client-artifact
          path: build/libs/*.jar
          
